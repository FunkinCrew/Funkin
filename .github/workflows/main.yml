name: Multiplatform Game Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies (FunkinCrew Style)
        shell: bash
        run: |
          haxelib --never newrepo

          # 1. Клонируем официальный стабильный hxcpp в нужную структуру папок
          git clone https://github.com/HaxeFoundation/hxcpp .haxelib/hxcpp/git
          haxelib dev hxcpp .haxelib/hxcpp/git

          # 2. Создаем маркер версии, чтобы hmm думал, что hxcpp уже установлен
          echo "git" > .haxelib/hxcpp/.current

          # 3. Ставим hmm и накатываем остальные либы из hmm.json
          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          # 4. Компилируем инструменты hxcpp
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../../../..

          haxelib run lime setup

      - name: Compile Game
        run: |
          haxelib run lime build ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }} -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-${{ matrix.os }}
          path: export/release/**

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies & Setup Android
        shell: bash
        run: |
          haxelib --never newrepo

          # Клонируем стабильный hxcpp для Android
          git clone https://github.com/HaxeFoundation/hxcpp .haxelib/hxcpp/git
          haxelib dev hxcpp .haxelib/hxcpp/git
          
          # Маркер версии для Android-сборки
          echo "git" > .haxelib/hxcpp/.current

          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../../../..
          
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK_ROOT $ANDROID_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compile APK
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
