name: Multiplatform Game Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies
        shell: bash
        run: |
          # Ядерная очистка кэша, чтобы избежать конфликтов путей
          rm -rf .haxelib
          haxelib --never newrepo

          # Фикс путей для Windows
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export HAXEPATH=$HAXE_PATH
          fi

          # Стандартные библиотеки из haxelib
          haxelib install format 3.5.0 --always --quiet
          haxelib install hamcrest 3.0.0 --always --quiet
          haxelib install hxdiscord_rpc 1.3.0 --always --quiet
          haxelib install hxgamemode 1.0.1 --always --quiet
          haxelib install hxp 1.3.0 --always --quiet
          haxelib install hxvlc 2.2.6 --always --quiet
          haxelib install jsonpatch 1.1.0 --always --quiet
          haxelib install jsonpath 1.1.0 --always --quiet
          haxelib install extension-androidtools 2.2.2 --always --quiet
          haxelib install extension-haptics 1.0.4 --always --quiet
          haxelib install extension-iapcore 1.0.4 --always --quiet
          haxelib install extension-iarcore 1.0.3 --always --quiet

          # Фикс hxcpp (ставим стабильную из haxelib вместо битого коммита)
          haxelib install hxcpp 4.3.2 --always --quiet

          # Git-зависимости (зашиваем список напрямую через haxelib git)
          haxelib git FlxPartialSound https://github.com/FunkinCrew/FlxPartialSound.git 2f984e244f1544ca98c0e03b9b21ae570f07ac55 --always --quiet
          haxelib git astc-compressor https://github.com/KarimAkra/astc-compressor b7a91b3072dc16e785a9bde847f17ba0ef15dd47 --always --quiet
          haxelib git extension-admob https://github.com/FunkinCrew/extension-admob 5c908b3f7c74115a8b52eddf1e05525f4873f26e --always --quiet
          haxelib git extension-webviewcore https://github.com/LimeExtensions/extension-webviewcore d13109450d65c40678244ca23b1aa88ac18d77e6 --always --quiet
          haxelib git flixel https://github.com/FunkinCrew/flixel f7b94eebf7dbb452a929d0c67ab31a9cbd71d3a0 --always --quiet
          haxelib git flixel-addons https://github.com/FunkinCrew/flixel-addons 187f93b34f93c6a405d634a42913c745e443463a --always --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate c5e3393c70b71a191f20fa902114cea92042e486 --always --quiet
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 02bada154b474c2554709b9d12aef0cbf0da3ec9 --always --quiet
          haxelib git grig.audio https://github.com/FunkinCrew/grig.audio 6409f3c6d1b4c52176813d3ede86c0d34e8af2c1 src --always --quiet
          haxelib git haxeui-core https://github.com/FunkinCrew/haxeui-core 09f2512564b45e92229e21433e6dd482391f7b7d --always --quiet
          haxelib git haxeui-flixel https://github.com/haxeui/haxeui-flixel 100f2c96beab619cfe72c567a058c41c71e3e998 --always --quiet
          haxelib git hxcpp-debug-server https://github.com/FunkinCrew/hxcpp-debugger 7459934666a473a4cc4d066ba4a93ef92f1ce94c hxcpp-debug-server --always --quiet
          haxelib git hxjsonast https://github.com/nadako/hxjsonast/ 20e72cc68c823496359775ac1f06500e67f189d5 --always --quiet
          haxelib git json2object https://github.com/FunkinCrew/json2object 59e0467c953d1f26e3cbf2a070f140e2d2e8457d --always --quiet
          haxelib git lime https://github.com/FunkinCrew/lime 826d25199c17329b730ae09838f3df7a2903c471 --always --quiet
          haxelib git newgrounds https://github.com/FunkinCrew/Newgrounds b2b53cd0a5f030af74efd325732951cddbea8826 --always --quiet
          haxelib git openfl https://github.com/FunkinCrew/openfl 88534506595a32c3f02b21b3987e789a24074ae7 --always --quiet
          haxelib git polymod https://github.com/FunkinCrew/polymod fb123758b90127f5647727727f273d27e93cabdb --always --quiet
          haxelib git thx.core https://github.com/fponticelli/thx.core 2bf2b992e06159510f595554e6b952e47922f128 --always --quiet
          haxelib git thx.semver https://github.com/fponticelli/thx.semver bdb191fe7cf745c02a980749906dbf22719e200b --always --quiet

          # Ребилд инструментов
          haxelib run hxcpp
          haxelib run lime rebuild tools

      - name: Compile Game
        run: |
          haxelib run lime build ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }} -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-${{ matrix.os }}
          path: export/release/**

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies & Setup Android
        shell: bash
        run: |
          # Ядерная очистка кэша для Android-раннера
          rm -rf .haxelib
          haxelib --never newrepo

          # Стандартные библиотеки из haxelib
          haxelib install format 3.5.0 --always --quiet
          haxelib install hamcrest 3.0.0 --always --quiet
          haxelib install hxdiscord_rpc 1.3.0 --always --quiet
          haxelib install hxgamemode 1.0.1 --always --quiet
          haxelib install hxp 1.3.0 --always --quiet
          haxelib install hxvlc 2.2.6 --always --quiet
          haxelib install jsonpatch 1.1.0 --always --quiet
          haxelib install jsonpath 1.1.0 --always --quiet
          haxelib install extension-androidtools 2.2.2 --always --quiet
          haxelib install extension-haptics 1.0.4 --always --quiet
          haxelib install extension-iapcore 1.0.4 --always --quiet
          haxelib install extension-iarcore 1.0.3 --always --quiet

          # Фикс hxcpp (ставим стабильную из haxelib вместо битого коммита)
          haxelib install hxcpp 4.3.2 --always --quiet

          # Git-зависимости (зашиваем список напрямую через haxelib git)
          haxelib git FlxPartialSound https://github.com/FunkinCrew/FlxPartialSound.git 2f984e244f1544ca98c0e03b9b21ae570f07ac55 --always --quiet
          haxelib git astc-compressor https://github.com/KarimAkra/astc-compressor b7a91b3072dc16e785a9bde847f17ba0ef15dd47 --always --quiet
          haxelib git extension-admob https://github.com/FunkinCrew/extension-admob 5c908b3f7c74115a8b52eddf1e05525f4873f26e --always --quiet
          haxelib git extension-webviewcore https://github.com/LimeExtensions/extension-webviewcore d13109450d65c40678244ca23b1aa88ac18d77e6 --always --quiet
          haxelib git flixel https://github.com/FunkinCrew/flixel f7b94eebf7dbb452a929d0c67ab31a9cbd71d3a0 --always --quiet
          haxelib git flixel-addons https://github.com/FunkinCrew/flixel-addons 187f93b34f93c6a405d634a42913c745e443463a --always --quiet
          haxelib git flixel-animate https://github.com/MaybeMaru/flixel-animate c5e3393c70b71a191f20fa902114cea92042e486 --always --quiet
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 02bada154b474c2554709b9d12aef0cbf0da3ec9 --always --quiet
          haxelib git grig.audio https://github.com/FunkinCrew/grig.audio 6409f3c6d1b4c52176813d3ede86c0d34e8af2c1 src --always --quiet
          haxelib git haxeui-core https://github.com/FunkinCrew/haxeui-core 09f2512564b45e92229e21433e6dd482391f7b7d --always --quiet
          haxelib git haxeui-flixel https://github.com/haxeui/haxeui-flixel 100f2c96beab619cfe72c567a058c41c71e3e998 --always --quiet
          haxelib git hxcpp-debug-server https://github.com/FunkinCrew/hxcpp-debugger 7459934666a473a4cc4d066ba4a93ef92f1ce94c hxcpp-debug-server --always --quiet
          haxelib git hxjsonast https://github.com/nadako/hxjsonast/ 20e72cc68c823496359775ac1f06500e67f189d5 --always --quiet
          haxelib git json2object https://github.com/FunkinCrew/json2object 59e0467c953d1f26e3cbf2a070f140e2d2e8457d --always --quiet
          haxelib git lime https://github.com/FunkinCrew/lime 826d25199c17329b730ae09838f3df7a2903c471 --always --quiet
          haxelib git newgrounds https://github.com/FunkinCrew/Newgrounds b2b53cd0a5f030af74efd325732951cddbea8826 --always --quiet
          haxelib git openfl https://github.com/FunkinCrew/openfl 88534506595a32c3f02b21b3987e789a24074ae7 --always --quiet
          haxelib git polymod https://github.com/FunkinCrew/polymod fb123758b90127f5647727727f273d27e93cabdb --always --quiet
          haxelib git thx.core https://github.com/fponticelli/thx.core 2bf2b992e06159510f595554e6b952e47922f128 --always --quiet
          haxelib git thx.semver https://github.com/fponticelli/thx.semver bdb191fe7cf745c02a980749906dbf22719e200b --always --quiet

          # Ребилд инструментов
          haxelib run hxcpp
          haxelib run lime rebuild tools
          
          # Конфигурация путей
          haxelib run lime config ANDROID_SDK_ROOT $ANDROID_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compile APK
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
