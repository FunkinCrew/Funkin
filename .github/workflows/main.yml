name: Multiplatform Game Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies (FunkinCrew Style)
        shell: bash
        run: |
          haxelib --never newrepo
          
          # 1. Вырезаем hxcpp из hmm.json, чтобы hmm его не трогал
          sed -i '/"hxcpp"/d' hmm.json || sed -i '' '/"hxcpp"/d' hmm.json

          # 2. Ручной клон правильного коммита hxcpp
          git clone https://github.com/FunkinCrew/hxcpp .haxelib/hxcpp/git
          cd .haxelib/hxcpp/git
          git checkout 450d112e50acff57b1bc9d584dcf1374c9e33995
          cd ../../..
          haxelib dev hxcpp .haxelib/hxcpp/git

          # 3. Ставим hmm и накатываем остальные либы без конфликтов
          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          # 4. Компилируем инструменты hxcpp
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../../../..

          haxelib run lime setup

      - name: Compile Game
        run: |
          haxelib run lime build ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }} -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-${{ matrix.os }}
          path: export/release/**

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies & Setup Android
        shell: bash
        run: |
          haxelib --never newrepo
          
          # Вырезаем hxcpp из манифеста зависимостей для Android
          sed -i '/"hxcpp"/d' hmm.json || sed -i '' '/"hxcpp"/d' hmm.json

          # Ручной клон hxcpp
          git clone https://github.com/FunkinCrew/hxcpp .haxelib/hxcpp/git
          cd .haxelib/hxcpp/git
          git checkout 450d112e50acff57b1bc9d584dcf1374c9e33995
          cd ../../..
          haxelib dev hxcpp .haxelib/hxcpp/git

          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../../../..
          
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK_ROOT $ANDROID_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compile APK
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
