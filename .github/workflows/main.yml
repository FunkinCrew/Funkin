name: Multiplatform Game Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies
        shell: bash
        run: |
          haxelib --never newrepo

          # Фикс путей для Windows раннера, чтобы hmm не падал
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export HAXEPATH=$HAXE_PATH
          fi

          # Устанавливаем hmm и даем ему стянуть ВСЕ правильные зависимости из hmm.json
          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          # Собираем инструменты hxcpp и lime из тех исходников, что скачал hmm
          haxelib run hxcpp
          haxelib run lime rebuild tools

      - name: Compile Game
        run: |
          haxelib run lime build ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }} -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-${{ matrix.os }}
          path: export/release/**

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Dependencies & Setup Android
        shell: bash
        run: |
          haxelib --never newrepo

          # Ставим зависимости строго по твоему hmm.json
          haxelib install hmm --always --quiet
          haxelib run hmm setup --unregistered
          haxelib run hmm install -q

          # Нативный ребилд инструментов
          haxelib run hxcpp
          haxelib run lime rebuild tools
          
          # Конфигурируем Android окружение внутри haxelib
          haxelib run lime config ANDROID_SDK_ROOT $ANDROID_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Compile APK
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
